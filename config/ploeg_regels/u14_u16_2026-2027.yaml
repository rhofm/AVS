# Regels U14/U16-competitie - Wedstrijdbepalingen Competitie 2026-2027
# (Atletiekunie, april 2026). Bepalingen 4, 9, 10, 18 en 70-75.
#
# Dit bestand mag een ploegleider aanpassen. Na het opslaan leest AVS het
# opnieuw in; een fout (tikfout, onbekend onderdeel) wordt in gewone taal gemeld.
#
# Onderdeelsleutels zijn dezelfde als in config/puntentelling/au_2025.yaml.
# Categorieën: <leeftijd>-<geslacht>, bijv. U14-V (meisjes), U16-M (jongens).

naam: U14/U16-competitie
seizoen: 2026-2027
bron: Wedstrijdbepalingen Competitie 2026-2027 (april 2026)
puntentelling: au_2025          # bestand in config/puntentelling/
puntentabel: au_u14_u16          # zelfde tabel voor jongens en meisjes
puntentoekenning: prestatie      # 18.1: punten naar prestatie

algemeen:
  max_onderdelen_per_atleet: 3   # 4.1, estafettes tellen mee
  max_reserves: 4                # 9.3
  een_ploeg_per_dag: true        # 10.10: niet in twee ploegen op één dag (ook niet U14 + U16)
  een_atleet_per_groep: true     # 9.1: per groep van een technisch onderdeel één atleet per ploeg
  tellend:                       # 70 *): zoveel beste atleten per onderdeel tellen
    loop: 2
    technisch: 1
  materiaal: ploeg               # werpmateriaal en hordehoogte van de ploeg, niet van de atleet
  voorspelling_factor: 0.95      # voorspelde punten = punten van de bron x 0.95 (0 = niet voorspellen)

ploegen:
  U14-V:
    naam: U14 meisjes
    geslacht: V
    toegestaan: [U14-V]          # U12 mag niet meedoen
    programma:
      wedstrijd_1: {60m: 3, 1000m: 3, 60mH: 3, 4x60m: 1, hoogspringen: 2, verspringen: 2, kogelstoten: 2, discuswerpen: 2, speerwerpen: 2}
      wedstrijd_2: {60m: 3, 600m: 3, 60mH: 3, 4x60m: 1, hoogspringen: 2, verspringen: 2, kogelstoten: 2, speerwerpen: 2}
      wedstrijd_3: {60m: 3, 1000m: 3, 60mH: 3, 4x60m: 1, hoogspringen: 2, verspringen: 2, kogelstoten: 2, discuswerpen: 2}
      finale_2026: {60m: 3, 1000m: 3, 60mH: 3, 4x60m: 1, hoogspringen: 2, verspringen: 2, kogelstoten: 2, discuswerpen: 2}
      finale_2027: {60m: 3, 600m: 3, 60mH: 3, 4x60m: 1, hoogspringen: 2, verspringen: 2, kogelstoten: 2, speerwerpen: 2}

  U14-M:
    naam: U14 jongens
    geslacht: M
    toegestaan: [U14-M]          # U12 mag niet meedoen
    programma:
      wedstrijd_1: {80m: 3, 1000m: 3, 80mH: 3, 4x80m: 1, hoogspringen: 2, verspringen: 2, kogelstoten: 2, speerwerpen: 2}
      wedstrijd_2: {80m: 3, 600m: 3, 80mH: 3, 4x80m: 1, hoogspringen: 2, verspringen: 2, kogelstoten: 2, discuswerpen: 2}
      wedstrijd_3: {80m: 3, 1000m: 3, 80mH: 3, 4x80m: 1, hoogspringen: 2, verspringen: 2, kogelstoten: 2, discuswerpen: 2, speerwerpen: 2}
      finale_2026: {80m: 3, 600m: 3, 80mH: 3, 4x80m: 1, hoogspringen: 2, verspringen: 2, kogelstoten: 2, speerwerpen: 2}
      finale_2027: {80m: 3, 1000m: 3, 80mH: 3, 4x80m: 1, hoogspringen: 2, verspringen: 2, kogelstoten: 2, discuswerpen: 2}

  U16-V:
    naam: U16 meisjes
    geslacht: V
    toegestaan: [U14-V, U16-V]   # een U14 mag in de U16-ploeg (10.10, opmerking)
    programma:
      wedstrijd_1: {80m: 3, 800m: 3, 80mH: 3, 4x80m: 1, hoogspringen: 2, verspringen: 2, kogelstoten: 2, discuswerpen: 2}
      wedstrijd_2: {150m: 3, 1500m: 3, 80mH: 3, 4x80m: 1, hoogspringen: 2, verspringen: 2, kogelstoten: 2, discuswerpen: 2, speerwerpen: 2}
      wedstrijd_3: {80m: 3, 800m: 3, 300mH: 3, 4x80m: 1, hoogspringen: 2, verspringen: 2, kogelstoten: 2, speerwerpen: 2}
      finale_2026: {80m: 3, 1500m: 3, 80mH: 3, 4x80m: 1, hoogspringen: 2, verspringen: 2, kogelstoten: 2, speerwerpen: 2}
      finale_2027: {150m: 3, 800m: 3, 300mH: 3, 4x80m: 1, hoogspringen: 2, verspringen: 2, kogelstoten: 2, discuswerpen: 2}

  U16-M:
    naam: U16 jongens
    geslacht: M
    toegestaan: [U14-M, U16-M]
    programma:
      wedstrijd_1: {100m: 3, 800m: 3, 100mH: 3, 4x100m: 1, hoogspringen: 2, verspringen: 2, kogelstoten: 2, discuswerpen: 2, speerwerpen: 2}
      wedstrijd_2: {150m: 3, 1500m: 3, 100mH: 3, 4x100m: 1, hoogspringen: 2, verspringen: 2, kogelstoten: 2, speerwerpen: 2}
      wedstrijd_3: {100m: 3, 800m: 3, 300mH: 3, 4x100m: 1, hoogspringen: 2, verspringen: 2, kogelstoten: 2, discuswerpen: 2}
      finale_2026: {100m: 3, 1500m: 3, 100mH: 3, 4x100m: 1, hoogspringen: 2, verspringen: 2, kogelstoten: 2, discuswerpen: 2}
      finale_2027: {150m: 3, 800m: 3, 300mH: 3, 4x100m: 1, hoogspringen: 2, verspringen: 2, kogelstoten: 2, speerwerpen: 2}

# Hoe de onderdelen heten bij de prestaties (zoals atletiek.nu ze noemt) en
# welke specificatie (hordehoogte, gewicht) bij welke categorie hoort.
# Met 'materiaal: ploeg' telt de categorie van de ploeg: een U14-meisje in de
# U16-ploeg gooit met de U16-kogel.
#
# Voorspellen (ploeg/voorspeller.py) als een atleet het onderdeel nog niet deed:
#   buren:      voorspel uit deze onderdelen, via gelijke punten (80m -> 100m)
#   verhouding: omrekenen tussen specificaties: prestatie x verhouding[doel] / verhouding[bron]
#               (kogel 9,00 m met 2kg -> 9,00 x 0.87 = 7,83 m met 3kg). Ruwe schattingen.
# Estafettes (ploeg/estafettes.py):
#   benen:       welk onderdeel elke loper loopt; tijd = som van hun tijden + correctie_s
#   correctie_s: winst door de wissels (vliegende start), ruwe schatting
onderdelen:
  60m:    {naam: 60 meter,   buren: [80m]}
  80m:    {naam: 80 meter,   buren: [60m, 100m, 150m]}
  100m:   {naam: 100 meter,  buren: [80m, 150m]}
  150m:   {naam: 150 meter,  buren: [100m, 80m]}
  600m:   {naam: 600 meter,  buren: [800m, 1000m]}
  800m:   {naam: 800 meter,  buren: [600m, 1000m, 1500m]}
  1000m:  {naam: 1000 meter, buren: [800m, 1500m, 600m]}
  1500m:  {naam: 1500 meter, buren: [1000m, 800m]}
  60mH:   {naam: 60 meter horden,  specificatie: {U14-V: 76.2cm}, buren: [80mH],
           verhouding: {68.6cm: 0.97, 76.2cm: 1.0, 83.8cm: 1.03}}
  80mH:   {naam: 80 meter horden,  specificatie: {U14-M: 76.2cm, U16-V: 76.2cm}, buren: [60mH],
           verhouding: {68.6cm: 0.97, 76.2cm: 1.0, 83.8cm: 1.03}}
  100mH:  {naam: 100 meter horden, specificatie: {U16-M: 83.8cm}, verhouding: {76.2cm: 0.97, 83.8cm: 1.0, 91.4cm: 1.03}}
  300mH:  {naam: 300 meter horden, specificatie: {U16-V: 76.2cm, U16-M: 76.2cm}, verhouding: {76.2cm: 1.0, 83.8cm: 1.02}}
  4x60m:  {naam: 4 x 60 meter,  lopers: 4, benen: [60m, 60m, 60m, 60m],     correctie_s: -0.8}
  4x80m:  {naam: 4 x 80 meter,  lopers: 4, benen: [80m, 80m, 80m, 80m],     correctie_s: -1.0}
  4x100m: {naam: 4 x 100 meter, lopers: 4, benen: [100m, 100m, 100m, 100m], correctie_s: -1.2}
  hoogspringen: {naam: Hoogspringen}
  verspringen:  {naam: Verspringen}
  kogelstoten:  {naam: Kogelstoten,  specificatie: {U14-V: 2kg, U14-M: 3kg, U16-V: 3kg, U16-M: 4kg},
                 verhouding: {2kg: 1.0, 2.5kg: 0.93, 3kg: 0.87, 4kg: 0.77, 5kg: 0.70}}
  discuswerpen: {naam: Discuswerpen, specificatie: {U14-V: 0.75kg, U14-M: 1kg, U16-V: 1kg, U16-M: 1kg},
                 verhouding: {0.6kg: 1.06, 0.75kg: 1.0, 1kg: 0.88, 1.5kg: 0.76}}
  speerwerpen:  {naam: Speerwerpen,  specificatie: {U14-V: 400g, U14-M: 400g, U16-V: 500g, U16-M: 600g},
                 verhouding: {400g: 1.0, 500g: 0.93, 600g: 0.87, 700g: 0.82}}
