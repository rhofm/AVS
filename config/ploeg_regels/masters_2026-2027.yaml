# Regels Mastercompetitie - Wedstrijdbepalingen Competitie 2026-2027
# (Atletiekunie, april 2026). Bepalingen 4, 9, 10, 18 en 60-65.
#
# Eén divisie; aparte ploegen voor mannen en vrouwen (bepaling 5). Twee
# voorrondewedstrijden en een finale (per vereniging één mannen- en één
# vrouwenploeg in de finale, 62.3). Per onderdeel telt alleen de beste atleet (18.3).
#
# Masters doen mee in een leeftijdsklasse (M35, V40, ...) op hun leeftijd op de
# wedstrijddag ('leeftijdsklassen: masters') en werpen met het materiaal van hun
# eigen klasse (65.1): 'V50+: 3kg' = vanaf V50 (tot de volgende grens).
#
# De punten worden met 'age grading' berekend (65.2): prestatie x leeftijdsfactor,
# dan de seniorentabel. De factoren staan in config/puntentelling/masters_agegrading.yaml
# en moeten nog worden ingevuld; zolang een factor ontbreekt, telt de gewone
# seniorenpunt (de ploegpagina meldt dat). Estafettes: zonder leeftijdsfactor.
# CONTROLEREN: werpgewichten per klasse volgens het wedstrijdreglement (WMA).

naam: Mastercompetitie
seizoen: 2026-2027
bron: Wedstrijdbepalingen Competitie 2026-2027 (april 2026)
puntentelling: au_2025
puntentabel: au_senioren        # 18.4
leeftijdsfactoren: masters_agegrading   # 65.2: age grading, config/puntentelling/masters_agegrading.yaml
puntentoekenning: prestatie
leeftijdsklassen: masters

algemeen:
  max_onderdelen_per_atleet: 3   # 4.1, estafettes tellen mee
  max_reserves: 4                # 9.3
  een_ploeg_per_dag: true        # 10.10
  een_atleet_per_groep: true     # 9.1
  tellend:                       # 60 *): alleen de beste atleet per ploeg telt
    loop: 1
    technisch: 1
  materiaal: eigen               # 65.1: materiaal van de eigen leeftijdsklasse
  voorspelling_factor: 0.95      # voorspelde punten = punten van de bron x 0.95 (0 = niet voorspellen)

ploegen:
  MAS-V:
    naam: Masters vrouwen
    geslacht: V
    toegestaan: [V35+]
    programma:
      wedstrijd_1: {100m: 2, 200m: 2, 400m: 2, 1500m: 2, 4x100m: 1, hoogspringen: 2, verspringen: 2,
                    kogelstoten: 2, discuswerpen: 2}
      wedstrijd_2: {100m: 2, 200m: 2, 800m: 2, 3000m: 2, zweedse: 1, hoogspringen: 2, verspringen: 2,
                    kogelstoten: 2, speerwerpen: 2, kogelslingeren: 2}
      finale: {100m: 2, 400m: 2, 1500m: 2, 3000m: 2, 4x200m: 1, hoogspringen: 2, verspringen: 2,
               kogelstoten: 2, discuswerpen: 1, speerwerpen: 1, kogelslingeren: 1}

  MAS-M:
    naam: Masters mannen
    geslacht: M
    toegestaan: [M35+]
    programma:
      wedstrijd_1: {100m: 2, 200m: 2, 400m: 2, 1500m: 2, 4x100m: 1, hoogspringen: 2, verspringen: 2,
                    kogelstoten: 2, discuswerpen: 2, speerwerpen: 2}
      wedstrijd_2: {100m: 2, 200m: 2, 800m: 2, 5000m: 2, zweedse: 1, hoogspringen: 2, verspringen: 2,
                    kogelstoten: 2, kogelslingeren: 2}
      finale: {100m: 2, 400m: 2, 1500m: 2, 5000m: 2, 4x200m: 1, hoogspringen: 2, verspringen: 2,
               kogelstoten: 2, discuswerpen: 1, speerwerpen: 1, kogelslingeren: 1}

# Voorspellen (ploeg/voorspeller.py): 'buren' = voorspel uit deze onderdelen via
# gelijke punten; 'verhouding' = omrekenen tussen werpgewichten (prestatie x
# verhouding[doel] / verhouding[bron]), handig als een master net een klasse
# ouder is. Estafettes (ploeg/estafettes.py): tijd = som van de beentijden
# ('benen') + 'correctie_s' (wissels). Ruwe schattingen.
onderdelen:
  100m:    {naam: 100 meter,  buren: [200m]}
  200m:    {naam: 200 meter,  buren: [100m, 400m]}
  300m:    {naam: 300 meter,  buren: [200m, 400m, 100m]}          # alleen voor de Zweedse estafette
  400m:    {naam: 400 meter,  buren: [200m, 800m]}
  800m:    {naam: 800 meter,  buren: [400m, 1500m]}
  1500m:   {naam: 1500 meter, buren: [800m, 3000m]}
  3000m:   {naam: 3000 meter, buren: [1500m, 5000m]}
  5000m:   {naam: 5000 meter, buren: [3000m]}
  4x100m:  {naam: 4 x 100 meter, lopers: 4, benen: [100m, 100m, 100m, 100m], correctie_s: -1.5}
  4x200m:  {naam: 4 x 200 meter, lopers: 4, benen: [200m, 200m, 200m, 200m], correctie_s: -1.5}
  zweedse: {naam: Zweedse estafette, lopers: 4, benen: [100m, 200m, 300m, 400m], correctie_s: -1.5}
  hoogspringen: {naam: Hoogspringen}
  verspringen:  {naam: Verspringen}
  kogelstoten:
    naam: Kogelstoten
    specificatie: {V35+: 4kg, V50+: 3kg, V75+: 2kg, M35+: 7.26kg, M50+: 6kg, M60+: 5kg, M70+: 4kg, M80+: 3kg}
    verhouding: {2kg: 1.0, 3kg: 0.87, 4kg: 0.77, 5kg: 0.70, 6kg: 0.64, 7.26kg: 0.57}
  discuswerpen:
    naam: Discuswerpen
    specificatie: {V35+: 1kg, V75+: 0.75kg, M35+: 2kg, M50+: 1.5kg, M60+: 1kg}
    verhouding: {0.75kg: 1.0, 1kg: 0.88, 1.5kg: 0.76, 2kg: 0.68}
  speerwerpen:
    naam: Speerwerpen
    specificatie: {V35+: 600g, V50+: 500g, V75+: 400g, M35+: 800g, M50+: 700g, M60+: 600g, M70+: 500g, M80+: 400g}
    verhouding: {400g: 1.0, 500g: 0.93, 600g: 0.87, 700g: 0.82, 800g: 0.77}
  kogelslingeren:
    naam: Kogelslingeren
    specificatie: {V35+: 4kg, V50+: 3kg, V75+: 2kg, M35+: 7.26kg, M50+: 6kg, M60+: 5kg, M70+: 4kg, M80+: 3kg}
    verhouding: {2kg: 1.08, 3kg: 1.0, 4kg: 0.90, 5kg: 0.82, 6kg: 0.76, 7.26kg: 0.69}
