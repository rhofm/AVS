# Puntentelling - constanten uit "Formules & Constanten", december 2025
# (14e uitgave, Werkgroep Wedstrijdreglement, Atletiekunie).
#
# Nieuwe uitgave van het document? Maak een nieuw bestand (bijv. au_2027.yaml)
# en laat dit bestand staan: oude ploegopstellingen blijven zo uit te leggen.
#
# Opbouw:
#   tabellen:
#     <tabel>:                 # welke puntentelling (zie 'omschrijving')
#       <geslacht>:            # M, V, of 'alle' (zelfde constanten voor iedereen)
#         <onderdeel>: {formule: ..., A: ..., B: ..., C: ...}
#
# Een onderdeel met een knik (bijv. hoogspringen tot en met 1,35 m een andere
# formule) is een lijst: elk stuk behalve het laatste heeft 'tot' (tot en met).
#
# Formules (prestatie in seconden of meters; INT = afkappen, niet afronden):
#   au_loop    INT(A / tijd - B)
#   au_techn   INT(A * sqrt(afstand) - B)
#   lineair    INT((afstand - B) * A + C)
#   wa_loop    INT(A * (B - tijd) ^ C)
#   wa_spring  INT(A * (100 * (afstand - B)) ^ C)
#   wa_werp    INT(A * (afstand - B) ^ C)
#
# Onderdeelnamen (sleutels):
#   lopen      30m ... 5000m, 2000mSC, 3000mSC (steeplechase)
#   horden     50mH, 60mH, 80mH, 100mH, 110mH, 300mH, 400mH
#              U14/U16: 50mH, 60mH, 80mH, 300mH = 76,2 cm; 50mH-84, 60mH-84, 100mH = 84 cm
#   estafettes 4x40m, 4x60m, 4x80m, 4x100m, 4x200m, 4x400m, 4x400m-gemengd, zweedse
#   technisch  hoogspringen, polsstokhoogspringen, verspringen, hinkstapspringen,
#              kogelstoten, discuswerpen, speerwerpen, kogelslingeren,
#              gewichtwerpen, balwerpen

