# Leeftijdsfactoren ('age grading') voor de Mastercompetitie, bepaling 65.2:
# "Bij de bepaling van de punten voor een onderdeel wordt gebruik gemaakt van
# age-grading-tabellen. Deze worden gepubliceerd op de website van de
# Atletiekunie."
#
# Bron: de tabel 'Gradings' uit de spreadsheet 'Mastersploeg 2023' (Age grading in
# de Masterscompetitie, dec 2022, gemaakt door Weia Reinboud). De factoren in
# 'Formules & Constanten' (meerkampen masters) zijn NIET voor de competitie bedoeld
# en staan hier dus niet in.
#
# De tabel is per leeftijdsklasse van vijf jaar: de sleutel is de ondergrens van
# de klasse (35 = M35/V35, dus 35 t/m 39 jaar; 40 = 40 t/m 44 jaar; ... 100 = 100+).
# Leeftijd = leeftijd op de wedstrijddag; AVS neemt de dichtstbijzijnde lagere
# sleutel, dus een atleet van 47 krijgt de factor van 45.
#
# Hoe AVS rekent (zoals de spreadsheet): gecorrigeerde prestatie = prestatie x factor
# (een handtijd eerst met de handtijdcorrectie), een tijd naar boven en een afstand
# naar beneden afgerond op 0,01, dan de seniorenformule (au_senioren).
# Lopen: factor < 1; springen en werpen: factor > 1.
# Onderdeel = sleutel uit au_2025.yaml.
#
# Estafettes (4x100m, 4x200m, Zweedse) hebben geen leeftijdsfactor: de spreadsheet
# rekent ze zonder correctie. Gewichtwerpen staat niet in de tabel (geen onderdeel
# van de competitie). Het materiaal is dat van de eigen klasse (65.1), de kogel- en
# andere werpfactoren gelden dus voor het gewicht van de eigen klasse.

